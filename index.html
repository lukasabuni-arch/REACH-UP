<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08070a" />
  <meta name="description" content="Reach-up is coming soon. Thank you for visiting our website." />
  <title>Reach-up — Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    /* ============ THEME ============ */
    :root {
      --orange:       #ff7a18;
      --orange-light: #ffb347;
      --orange-deep:  #ff4d00;
      --bg:           #08070a;
      --white:        #ffffff;
      --muted:        rgba(255, 255, 255, 0.62);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 24px 90px;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* ============ BACKGROUND LAYERS ============ */
    .bg-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 20% 18%, rgba(255, 122, 0, 0.20), transparent 45%),
        radial-gradient(circle at 82% 78%, rgba(255, 77, 0, 0.18), transparent 50%);
      animation: glowShift 12s ease-in-out infinite alternate;
    }

    @keyframes glowShift {
      0%   { transform: scale(1)    translate(0, 0);       opacity: .85; }
      100% { transform: scale(1.18) translate(2%, -2.5%);  opacity: 1;   }
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
      opacity: .5;
    }
    .orb-1 {
      width: 380px; height: 380px;
      top: -130px; left: -110px;
      background: radial-gradient(circle, #ff7a18, transparent 70%);
      animation: float1 16s ease-in-out infinite;
    }
    .orb-2 {
      width: 320px; height: 320px;
      bottom: -120px; right: -100px;
      background: radial-gradient(circle, #ff4d00, transparent 70%);
      animation: float2 18s ease-in-out infinite;
    }
    .orb-3 {
      width: 220px; height: 220px;
      top: 55%; left: 62%;
      opacity: .32;
      background: radial-gradient(circle, #ffb347, transparent 70%);
      animation: float3 14s ease-in-out infinite;
    }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(60px, 50px) scale(1.12); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(-70px, -45px) scale(1.15); }
    }
    @keyframes float3 {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(-50px, 60px); }
    }

    /* Subtle animated grid */
    .grid-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255, 122, 0, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 122, 0, 0.055) 1px, transparent 1px);
      background-size: 60px 60px;
      -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 72%);
              mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 72%);
      animation: gridPan 22s linear infinite;
    }

    @keyframes gridPan {
      to { background-position: 60px 60px, 60px 60px; }
    }

    /* ============ CONTENT ============ */
    .content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 780px;
      width: 100%;
    }

    /* --- Badge --- */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px;
      border-radius: 999px;
      border: 1px solid rgba(255, 122, 0, 0.45);
      background: rgba(255, 122, 0, 0.08);
      color: var(--orange-light);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0;
      animation:
        fadeUp .8s .15s forwards,
        badgeGlow 3s ease-in-out infinite 1.4s;
    }

    @keyframes badgeGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(255, 122, 0, 0); }
      50%      { box-shadow: 0 0 28px rgba(255, 122, 0, 0.35); }
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 0 10px var(--orange);
      position: relative;
      flex-shrink: 0;
    }
    .dot::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--orange);
      animation: ping 1.9s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    @keyframes ping {
      0%        { transform: scale(1);   opacity: .8; }
      75%, 100% { transform: scale(3.2); opacity: 0;  }
    }

    /* --- Title --- */
    .title {
      font-size: clamp(3rem, 12vw, 7.5rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      margin: 26px 0 18px;
      perspective: 900px;
      animation: titlePulse 4.5s ease-in-out infinite 2.2s;
    }

    .title span {
      display: inline-block;
      background: linear-gradient(180deg, #ffd08a 0%, var(--orange) 48%, var(--orange-deep) 100%);
      -webkit-background-clip: text;
              background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      opacity: 0;
      transform: translateY(70px) rotateX(-80deg) scale(.85);
      transform-origin: bottom center;
      filter: drop-shadow(0 8px 30px rgba(255, 122, 0, 0.45));
      animation: dropIn .9s cubic-bezier(.18, .89, .32, 1.28) forwards;
      animation-delay: calc(.35s + var(--i) * .08s);
      will-change: transform, opacity;
    }

    @keyframes dropIn {
      to {
        opacity: 1;
        transform: translateY(0) rotateX(0) scale(1);
      }
    }

    @keyframes titlePulse {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(255, 122, 0, 0)); }
      50%      { filter: drop-shadow(0 0 28px rgba(255, 122, 0, 0.35)); }
    }

    /* --- Subtitle --- */
    .subtitle {
      font-size: clamp(1rem, 3.4vw, 1.6rem);
      font-weight: 500;
      text-transform: uppercase;
      color: var(--white);
      opacity: 0;
      text-shadow: 0 0 22px rgba(255, 122, 0, 0.55);
      animation: tracking .95s ease-out forwards;
      animation-delay: 1.15s;
    }

    @keyframes tracking {
      from {
        opacity: 0;
        letter-spacing: 0.9em;
        filter: blur(10px);
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        letter-spacing: 0.35em;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    /* --- Divider --- */
    .divider {
      width: 0;
      height: 2px;
      margin: 26px auto 0;
      border-radius: 99px;
      background: linear-gradient(90deg, transparent, var(--orange), transparent);
      animation: growLine 1.1s cubic-bezier(.2, .8, .2, 1) forwards;
      animation-delay: 1.5s;
    }

    @keyframes growLine {
      to { width: min(280px, 70vw); }
    }

    /* --- Thank you --- */
    .thanks {
      margin-top: 26px;
      font-size: clamp(0.92rem, 2.5vw, 1.08rem);
      color: var(--muted);
      letter-spacing: 0.02em;
      opacity: 0;
      animation: fadeUp .9s 1.75s forwards;
    }

    /* --- Loader --- */
    .loader {
      width: min(320px, 78vw);
      height: 4px;
      margin: 36px auto 0;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      position: relative;
      opacity: 0;
      animation: fadeUp .8s 2s forwards;
    }

    .loader::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 40%;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, transparent, var(--orange), var(--orange-light), transparent);
      animation: loadSweep 2.6s ease-in-out infinite;
    }

    @keyframes loadSweep {
      0%   { transform: translateX(-130%); }
      100% { transform: translateX(330%); }
    }

    /* --- Note --- */
    .note {
      margin-top: 20px;
      font-size: 0.82rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.34);
      opacity: 0;
      animation: fadeUp .8s 2.2s forwards;
    }

    /* --- Footer --- */
    .footer {
      position: fixed;
      left: 0; right: 0; bottom: 22px;
      z-index: 2;
      text-align: center;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.28);
      opacity: 0;
      animation: fadeUp .8s 2.4s forwards;
    }

    /* --- Shared keyframe --- */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 520px) {
      .subtitle { letter-spacing: 0.22em; }
      @keyframes tracking {
        from { opacity: 0; letter-spacing: .6em; filter: blur(10px); transform: translateY(12px); }
        to   { opacity: 1; letter-spacing: .22em; filter: blur(0);   transform: translateY(0);    }
      }
      .orb-3 { display: none; }
      body { padding-bottom: 80px; }
    }

    /* ============ ACCESSIBILITY ============ */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition: none !important;
      }
      .title span,
      .badge,
      .subtitle,
      .thanks,
      .loader,
      .note,
      .footer {
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
        letter-spacing: normal !important;
      }
      .divider { width: min(280px, 70vw) !important; }
    }
  </style>
</head>

<body>
  <!-- Background decoration -->
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="orb orb-1" aria-hidden="true"></div>
  <div class="orb orb-2" aria-hidden="true"></div>
  <div class="orb orb-3" aria-hidden="true"></div>
  <div class="grid-overlay" aria-hidden="true"></div>

  <!-- Main content -->
  <main class="content">
    <div class="badge">
      <span class="dot" aria-hidden="true"></span>
      Launching Soon
    </div>

    <h1 class="title" aria-label="Reach-up">
      <span style="--i:0" aria-hidden="true">R</span><span style="--i:1" aria-hidden="true">e</span><span style="--i:2" aria-hidden="true">a</span><span style="--i:3" aria-hidden="true">c</span><span style="--i:4" aria-hidden="true">h</span><span style="--i:5" aria-hidden="true">-</span><span style="--i:6" aria-hidden="true">u</span><span style="--i:7" aria-hidden="true">p</span>
    </h1>

    <h2 class="subtitle">Coming Soon</h2>

    <div class="divider" aria-hidden="true"></div>

    <p class="thanks">Thank you for visiting our website</p>

    <div class="loader" aria-hidden="true"></div>

    <p class="note">We're building something amazing — stay tuned</p>
  </main>

  <footer class="footer">
    &copy; <span id="year">2025</span> Reach-up. All rights reserved.
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
